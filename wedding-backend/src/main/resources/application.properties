spring.application.name=wedding-backend

# Runs immediately with an embedded file database.
# To use MySQL instead, set DB_URL, DB_USERNAME and DB_PASSWORD before starting.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/wedding_invitation;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Helpful while developing locally.
server.error.include-message=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console